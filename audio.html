<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Evercoil Blade — Endless Growth Neon Möbius Matrix</title>
<style>
  body {
	margin: 0;
	overflow: hidden;
	background: #000000;
	cursor: crosshair;
  }
  canvas { display: block; }
  #ui-container {
	position: absolute;
	bottom: 24px;
	width: 100%;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 16px;
	pointer-events: none;
	font-family: sans-serif;
  }
  #status {
	color: #fff;
	font-size: 13px;
	letter-spacing: 3px;
	text-transform: uppercase;
	text-shadow: 0 0 10px #ff5500, 0 0 20px #ff0055;
  }
  #controls {
	display: flex;
	gap: 15px;
	pointer-events: auto;
  }
  button {
	background: rgba(0, 0, 0, 0.9);
	color: #ffffff;
	border: 1px solid #ff00aa;
	padding: 10px 20px;
	border-radius: 4px;
	cursor: pointer;
	font-size: 11px;
	letter-spacing: 1.5px;
	text-transform: uppercase;
	transition: all 0.2s ease;
	box-shadow: 0 0 8px rgba(255, 0, 170, 0.3);
  }
  button:hover {
	background: #ff00aa;
	color: #000;
	box-shadow: 0 0 20px #ff00aa, 0 0 40px #ff00aa;
  }
  button.active {
	background: #00ffff;
	color: #000000;
	border-color: #00ffff;
	font-weight: bold;
	box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
  }
  #control-panel-wrapper {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
	background: rgba(0, 0, 0, 0.95);
	padding: 20px 28px;
	border-radius: 8px;
	border: 2px solid #00ffff;
	pointer-events: auto;
	box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
	max-width: 90%;
  }
  #infinite-actions {
	display: flex;
	gap: 12px;
  }
  .btn-action {
	background: #000;
	border-color: #ffaa00;
	color: #ffaa00;
	box-shadow: 0 0 8px rgba(255, 170, 0, 0.2);
  }
  .btn-action:hover {
	background: #ffaa00;
	color: #000;
	box-shadow: 0 0 20px #ffaa00;
  }
  /* Growth Button States */
  #btn-growth.growing {
	background: #ff0055;
	color: #ffffff;
	border-color: #ff0055;
	animation: neonPulse 1s infinite alternate;
  }
  @keyframes neonPulse {
	from { box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
	to { box-shadow: 0 0 25px #ff0055, 0 0 50px #ff0055; }
  }
  #slider-panel {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: 16px;
	max-height: 150px;
	overflow-y: auto;
	padding-right: 5px;
	scroll-behavior: smooth;
  }
  #slider-panel::-webkit-scrollbar {
	width: 6px;
  }
  #slider-panel::-webkit-scrollbar-thumb {
	background: #00ffff;
	border-radius: 3px;
  }
  .slider-group {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 6px;
	background: rgba(255, 255, 255, 0.05);
	padding: 10px;
	border-radius: 6px;
	border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .slider-group label {
	color: #ffffff;
	font-size: 10px;
	text-transform: uppercase;
	letter-spacing: 1px;
	font-weight: bold;
  }
  .slider-group span {
	color: #00ffff;
	font-size: 11px;
	font-family: monospace;
	text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
  }
  .slider-group input[type=range] {
	-webkit-appearance: none;
	width: 110px;
	background: #111;
	height: 6px;
	border-radius: 3px;
	outline: none;
	border: 1px solid rgba(255,255,255,0.2);
  }
  .slider-group input[type=range]::-webkit-slider-thumb {
	-webkit-appearance: none;
	appearance: none;
	width: 14px;
	height: 14px;
	border-radius: 50%;
	background: #ffffff;
	cursor: pointer;
	box-shadow: 0 0 10px #fff;
  }
</style>
</head>
<body>
<div id="ui-container">
  <div id="status">Infinite Multi-Möbius Growth Matrix</div>
  <div id="controls">
	<button id="btn-mic" onclick="switchMode('mic')">Microphone Mirror</button>
	<button id="btn-procedural" onclick="switchMode('procedural')">120 BPM Glow Matrix</button>
  </div>
  
  <div id="control-panel-wrapper">
	<div id="infinite-actions">
	  <button class="btn-action" onclick="addChannel()">+ Add Neon Loop</button>
	  <button class="btn-action" onclick="removeChannel()">- Remove Neon Loop</button>
	  <button id="btn-growth" class="btn-action" onclick="toggleGrowth()">∞ Auto-Grow Matrix</button>
	</div>
	<div id="slider-panel"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* =========================
   THREE.JS GLOBAL ENGINE
========================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 0, 7.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x050505));

const light1 = new THREE.PointLight(0xff00ff, 4, 30);
light1.position.set(4, 4, 3);
scene.add(light1);

const light2 = new THREE.PointLight(0x00ffff, 4, 30);
light2.position.set(-4, -4, 3);
scene.add(light2);

let mouseX = 0, mouseY = 0;
window.addEventListener("mousemove", e => {
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = -(e.clientY / innerHeight) * 2 + 1;
});

/* Core Plasma Node */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 })
);
scene.add(core);

/* Background Neon Dust particles */
const particleCount = 800;
const particles = new THREE.Points(
  new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(particleCount * 3), 3)),
  new THREE.PointsMaterial({ color: 0x00ffff, size: 0.025, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending })
);
scene.add(particles);
const pPos = particles.geometry.attributes.position.array;
for (let i = 0; i < particleCount; i++) {
  pPos[i*3] = (Math.random()-0.5) * 12;
  pPos[i*3+1] = (Math.random()-0.5) * 12;
  pPos[i*3+2] = (Math.random()-0.5) * 12;
}

/* =========================
   MÖBIUS GEOMETRY GENERATOR
========================= */
function generateMobiusGeometry(rad, width, uSpins, hue) {
  const detailU = 160;
  const detailV = 28;
  const positions = [];
  const colors = [];
  const baseColor = new THREE.Color().setHSL(hue, 1.0, 0.5);

  for (let i = 0; i <= detailU; i++) {
	const u = (i / detailU) * Math.PI * 2;
	for (let j = 0; j <= detailV; j++) {
	  let v = (j / detailV - 0.5) * width;
	  
	  let x = (rad + v * Math.cos(u * uSpins)) * Math.cos(u);
	  let y = (rad + v * Math.cos(u * uSpins)) * Math.sin(u);
	  let z = v * Math.sin(u * uSpins);

	  positions.push(x, y, z);
	  colors.push(baseColor.r, baseColor.g, baseColor.b);
	}
  }

  const indices = [];
  for (let i = 0; i < detailU; i++) {
	for (let j = 0; j < detailV; j++) {
	  const a = i * (detailV + 1) + j;
	  const b = (i + 1) * (detailV + 1) + j;
	  indices.push(a, b, a + 1, b, b + 1, a + 1);
	}
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  return {
	geometry: geo,
	originalPositions: new Float32Array(positions)
  };
}

/* =========================
   INFINITE AUDIO & VISUAL ENGINE
========================= */
let audioCtx, analyser, dataArray, currentMode = null, chargeLevel = 0;
let micStream = null, micSource = null, masterGain = null, bpmInterval = null, growthInterval = null;

let channelsData = []; 

function toggleGrowth() {
  const btn = document.getElementById('btn-growth');
  
  if (growthInterval) {
	// Stop recursive generation cycle
	clearInterval(growthInterval);
	growthInterval = null;
	btn.classList.remove('growing');
	btn.innerText = "∞ Auto-Grow Matrix";
  } else {
	// Start automatic recursive looping (adds a new unique channel track every 1.5 seconds)
	btn.classList.add('growing');
	btn.innerText = "■ Stop Growth";
	growthInterval = setInterval(() => {
	  addChannel();
	}, 1500);
  }
}

function addChannel() {
  const index = channelsData.length;
  
  const minHz = 60 + (index * 45);
  const maxHz = minHz + 120;
  const startHz = Math.floor((minHz + maxHz) / 2);

  const randomRadius = 1.0 + Math.random() * 2.0;
  const randomWidth = 0.3 + Math.random() * 0.5;
  const randomSpins = Math.random() > 0.5 ? 0.5 : 1.5;
  const distinctHue = (index * 0.23) % 1.0; 

  // UI Setup
  const container = document.createElement('div');
  container.className = 'slider-group';
  container.id = `ch-group-${index}`;
  container.style.borderTop = `3px solid hsl(${distinctHue * 360}, 100%, 50%)`;
  
  const label = document.createElement('label');
  label.innerText = `Loop ${index + 1}`;
  label.style.color = `hsl(${distinctHue * 360}, 100%, 75%)`;
  
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = minHz;
  slider.max = maxHz;
  slider.value = startHz;
  slider.oninput = () => updateChannelFrequencies(index);

  const display = document.createElement('span');
  
  container.appendChild(label);
  container.appendChild(slider);
  container.appendChild(display);
  
  const panel = document.getElementById('slider-panel');
  panel.appendChild(container);
  
  // Snap panel viewport view down synchronously to show newly spawned tracks
  panel.scrollTop = panel.scrollHeight;

  const mat = new THREE.MeshPhongMaterial({
	vertexColors: true,
	side: THREE.DoubleSide,
	shininess: 80,
	transparent: true,
	opacity: 0.85,
	blending: THREE.AdditiveBlending,
	depthWrite: false
  });

  const meshData = generateMobiusGeometry(randomRadius, randomWidth, randomSpins, distinctHue);
  const mesh = new THREE.Mesh(meshData.geometry, mat);
  
  mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  scene.add(mesh);

  const chObj = {
	slider: slider,
	display: display,
	container: container,
	mesh: mesh,
	originalPositions: meshData.originalPositions,
	hue: distinctHue,
	rotSpeedX: (Math.random() - 0.5) * 0.03,
	rotSpeedY: (Math.random() - 0.5) * 0.03,
	oscRow: null,
	oscCol: null,
	gainNode: null
  };

  channelsData.push(chObj);
  updateChannelFrequencies(index);

  if (audioCtx && currentMode === 'procedural') {
	spawnOscillatorPair(index);
	rebalanceMixGains();
  }
}

function removeChannel() {
  if (channelsData.length <= 1) return;
  const index = channelsData.length - 1;
  const ch = channelsData[index];

  if (ch.oscRow) { try { ch.oscRow.stop(); ch.oscRow.disconnect(); } catch(e){} }
  if (ch.oscCol) { try { ch.oscCol.stop(); ch.oscCol.disconnect(); } catch(e){} }
  if (ch.gainNode) { try { ch.gainNode.disconnect(); } catch(e){} }

  scene.remove(ch.mesh);
  ch.mesh.geometry.dispose();
  ch.mesh.material.dispose();

  ch.container.remove();
  channelsData.pop();
  
  if (audioCtx && currentMode === 'procedural') {
	rebalanceMixGains();
  }
}

function updateChannelFrequencies(index) {
  const ch = channelsData[index];
  if (!ch) return;

  const f1 = parseFloat(ch.slider.value);
  const dtmfRatio = 1.25 + ((index * 0.08) % 0.35); 
  const f2 = Math.round(f1 * dtmfRatio);
  
  ch.display.innerText = `${f1}Hz / ${f2}Hz`;

  if (audioCtx && currentMode === 'procedural' && ch.oscRow) {
	ch.oscRow.frequency.setValueAtTime(f1, audioCtx.currentTime);
	ch.oscCol.frequency.setValueAtTime(f2, audioCtx.currentTime);
  }
}

function spawnOscillatorPair(index) {
  const ch = channelsData[index];
  const f1 = parseFloat(ch.slider.value);
  const dtmfRatio = 1.25 + ((index * 0.08) % 0.35);
  const f2 = f1 * dtmfRatio;

  const channelGain = audioCtx.createGain();
  oscVolumeScaling = 0.55 / Math.sqrt(channelsData.length);
  channelGain.gain.value = oscVolumeScaling; 
  channelGain.connect(masterGain);

  const oscR = audioCtx.createOscillator();
  const oscC = audioCtx.createOscillator();
  oscR.type = 'sine';
  oscC.type = 'sine';

  oscR.frequency.value = f1;
  oscC.frequency.value = f2;

  oscR.connect(channelGain);
  oscC.connect(channelGain);

  oscR.start();
  oscC.start();

  ch.oscRow = oscR;
  ch.oscCol = oscC;
  ch.gainNode = channelGain;
}

// Recalculates master mix levels across all nodes dynamically to handle infinite tracking sums
function rebalanceMixGains() {
  const dynamicFactor = 0.55 / Math.sqrt(channelsData.length);
  channelsData.forEach(ch => {
	if (ch.gainNode) {
	  ch.gainNode.gain.setValueAtTime(dynamicFactor, audioCtx.currentTime);
	}
  });
}

function triggerRandomBPMChannels() {
  channelsData.forEach((ch, idx) => {
	const min = parseInt(ch.slider.min);
	const max = parseInt(ch.slider.max);
	ch.slider.value = Math.floor(Math.random() * (max - min + 1)) + min;
	updateChannelFrequencies(idx);
  });
}

function initAudioContext() {
  if (!audioCtx) {
	audioCtx = new (window.AudioContext || window.webkitAudioContext)();
	analyser = audioCtx.createAnalyser();
	analyser.fftSize = 512;
	dataArray = new Uint8Array(analyser.frequencyBinCount);
	masterGain = audioCtx.createGain();
	masterGain.gain.value = 0.25;
	masterGain.connect(audioCtx.destination);
  }
  audioCtx.resume();
}

async function switchMode(mode) {
  initAudioContext();
  cleanupCurrentMode();
  currentMode = mode;

  document.getElementById('btn-mic').classList.toggle('active', mode === 'mic');
  document.getElementById('btn-procedural').classList.toggle('active', mode === 'procedural');

  if (mode === 'mic') {
	document.getElementById('status').innerText = "Microphone Brightness Capture Mode";
	micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
	micSource = audioCtx.createMediaStreamSource(micStream);
	micSource.connect(analyser);
  } else {
	document.getElementById('status').innerText = "120 BPM Hyper-Vibrant Plasma Loop Synth";
	masterGain.connect(analyser);
	
	for (let i = 0; i < channelsData.length; i++) {
	  spawnOscillatorPair(i);
	}
	bpmInterval = setInterval(triggerRandomBPMChannels, 500); 
  }
}

function cleanupCurrentMode() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micSource) { micSource.disconnect(); micSource = null; }
  if (bpmInterval) { clearInterval(bpmInterval); bpmInterval = null; }
  
  channelsData.forEach(ch => {
	if (ch.oscRow) { try { ch.oscRow.stop(); ch.oscRow.disconnect(); } catch(e){} ch.oscRow = null; }
	if (ch.oscCol) { try { ch.oscCol.stop(); ch.oscCol.disconnect(); } catch(e){} ch.oscCol = null; }
	if (ch.gainNode) { try { ch.gainNode.disconnect(); } catch(e){} ch.gainNode = null; }
  });
}

/* =========================
   REAL-TIME RENDER PIPELINE
========================= */
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  const totalChannels = channelsData.length;
  let intensities = new Array(totalChannels).fill(0);

  if (analyser && currentMode) {
	analyser.getByteFrequencyData(dataArray);
	const len = dataArray.length;
	const chunkWidth = len / totalChannels;

	for(let k = 0; k < totalChannels; k++) {
	  const start = Math.floor(k * chunkWidth);
	  const end = Math.floor((k + 1) * chunkWidth);
	  const slice = dataArray.slice(start, end);
	  intensities[k] = slice.reduce((a,b) => a + b, 0) / Math.max(1, slice.length);
	}
  } else {
	channelsData.forEach((ch, idx) => {
	  intensities[idx] = 40 + Math.sin(time * 4 + idx * 1.5) * 35;
	});
  }

  let totalAmp = 0;

  channelsData.forEach((ch, idx) => {
	const rawAmp = intensities[idx];
	const energyNorm = rawAmp / 255;
	totalAmp += rawAmp;

	ch.mesh.rotation.x += ch.rotSpeedX * (1 + energyNorm * 8) + mouseY * 0.01;
	ch.mesh.rotation.y += ch.rotSpeedY * (1 + energyNorm * 8) + mouseX * 0.01;

	const scaleTuning = 1 + energyNorm * 0.8;
	ch.mesh.scale.set(scaleTuning, scaleTuning, scaleTuning);

	const posAttr = ch.mesh.geometry.attributes.position;
	const colorsAttr = ch.mesh.geometry.attributes.color;
	const currentHz = parseFloat(ch.slider.value);

	for (let i = 0; i < posAttr.count; i++) {
	  const origX = ch.originalPositions[i * 3];
	  const origY = ch.originalPositions[i * 3 + 1];
	  const origZ = ch.originalPositions[i * 3 + 2];

	  const morphFactor = Math.sin(time * 7 + (i * 0.06) + (currentHz * 0.015)) * (energyNorm * 0.45);

	  posAttr.array[i * 3]     = origX + morphFactor * (origX / 1.5);
	  posAttr.array[i * 3 + 1] = origY + morphFactor * (origY / 1.5);
	  posAttr.array[i * 3 + 2] = origZ + morphFactor;

	  const dynamicColor = new THREE.Color().setHSL(
		ch.hue, 
		1.0, 
		0.42 + energyNorm * 0.55
	  );
	  colorsAttr.array[i * 3]     = dynamicColor.r;
	  colorsAttr.array[i * 3 + 1] = dynamicColor.g;
	  colorsAttr.array[i * 3 + 2] = dynamicColor.b;
	}
	posAttr.needsUpdate = true;
	colorsAttr.needsUpdate = true;
  });

  const globalAvgNorm = (totalAmp / Math.max(1, totalChannels)) / 255;
  chargeLevel += (globalAvgNorm - chargeLevel) * 0.15;

  light1.intensity = 3 + chargeLevel * 15;
  light2.intensity = 3 + chargeLevel * 15;

  core.scale.setScalar(1 + chargeLevel * 4.5);
  particles.rotation.y += 0.004 + chargeLevel * 0.04;

  renderer.render(scene, camera);
}

// Generate starting loops configuration
for(let n=0; n<4; n++) { addChannel(); }
animate();

/* Resize */
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
